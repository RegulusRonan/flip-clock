<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <!-- Home-screen app on iPhone: use the whole screen (draw under the status
       bar) instead of losing a 47pt black band at the top. The CSS keeps
       content clear of the status bar and notch with safe-area insets. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Flip Clock" />
  <title>Flip Clock</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preload" href="/fonts/barlow-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="clock" title="Double-click for fullscreen">
    <div class="date" id="date">&nbsp;</div>

    <div class="cards">
      <div class="card" id="hours"></div>
      <div class="card" id="minutes"></div>
      <div class="card" id="seconds"></div>
    </div>

    <div class="motto" id="motto">&nbsp;</div>
  </main>

  <nav class="controls" id="controls" aria-label="Controls">
    <div class="row tabs">
      <button type="button" data-view="clock" title="Clock (C)">Clock</button>
      <button type="button" data-view="pomo" title="Pomodoro (P)">Pomodoro</button>
      <button type="button" data-view="timer" title="Timer (T)">Timer</button>
    </div>
    <div class="row actions">
      <button type="button" data-act="run" class="for-pomo for-timer" title="Start / pause (Space)">Start</button>
      <button type="button" data-act="reset" class="for-pomo for-timer" title="Reset (R)">Reset</button>
      <button type="button" data-act="skip" class="for-pomo" title="Skip to next session (S)">Skip</button>
      <button type="button" data-act="auto" class="for-pomo" title="Start the next session automatically (A)">Auto on</button>
      <button type="button" data-act="sound" title="Tick sound on / off (M)">Tick on</button>
    </div>
  </nav>

  <script src="/script.js"></script>
</body>
</html>
